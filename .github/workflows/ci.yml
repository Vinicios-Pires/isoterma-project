name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    # A 3.15 roda como experimental até todo o ecossistema publicar wheels para ela.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            experimental: false
          - python: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Tipos
        run: uv run pyright

      - name: Testes
        run: uv run pytest --cov
