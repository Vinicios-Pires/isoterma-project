# Os hooks rodam as mesmas versões travadas no uv.lock, via `uv run`.
# Instalação: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formatação)
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: pyright
        name: pyright (tipos)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
